{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bernadette's Höhenprofil Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container my-5">
        <h1 class="text-center mb-4">Bernadette's Höhenprofil Generator</h1>
        <form method="POST" enctype="multipart/form-data" class="row g-3">
            {% csrf_token %}
            
            <!-- GPX Upload -->
            <div class="col-md-12">
                <label for="gpx_file" class="form-label">Upload GPX file:</label>
                <input type="file" class="form-control" name="gpx_file" required>
            </div>

            <!-- Sportart Dropdown -->
            <div class="col-md-6">
                <label for="sport" class="form-label">Sportart:</label>
                <select id="sport" class="form-select">
                    <option value="">-- Choose --</option>
                    <option value="skitour">Skitour</option>
                    <option value="mtb">MTB</option>
                    <option value="laufen">Laufen</option>
                </select>
            </div>

            <!-- Schwierigkeit Dropdown -->
            <div class="col-md-6">
                <label for="difficulty" class="form-label">Schwierigkeit:</label>
                <select id="difficulty" class="form-select">
                    <option value="">-- Choose --</option>
                    <option value="leicht">Leicht</option>
                    <option value="mittel">Mittel</option>
                    <option value="schwer">Schwer</option>
                </select>
            </div>

            <!-- Colors -->
            <div class="col-md-6">
                <label for="line_color" class="form-label">Line Color:</label>
                <input type="color" class="form-control" name="line_color" value="#0000FF">
            </div>

            <div class="col-md-6">
                <label for="elements_color" class="form-label">Elements Color:</label>
                <input type="color" class="form-control" name="elements_color" value="#52AE33">
            </div>

            <div class="col-md-6">
                <label for="fill_color" class="form-label">Fill Color:</label>
                <input type="color" class="form-control" name="fill_color" value="#E0EDD4">
            </div>

            <!-- Smoothing -->
            <div class="col-md-6">
                <label for="smoothness" class="form-label">Smoothing:</label>
                <input type="number" class="form-control" name="smoothness" value="5" min="1" max="21">
            </div>

            <!-- Y Axis -->
            <div class="col-md-6">
                <label for="y_min" class="form-label">Y Axis Min:</label>
                <input type="number" class="form-control" name="y_min" value="500">
            </div>

            <div class="col-md-6">
                <label for="y_max" class="form-label">Y Axis Max:</label>
                <input type="number" class="form-control" name="y_max" value="2000">
            </div>

            <!-- Grid Style -->
            <div class="col-md-6">
                <label for="grid_style" class="form-label">Grid Style:</label>
                <select name="grid_style" class="form-select">
                    <option value="x">x</option>
                    <option value="y">y</option>
                    <option value="both">Both</option>
                </select>
            </div>

            <!-- Line Style -->
            <div class="col-md-6">
                <label for="line_style" class="form-label">Line Style:</label>
                <select name="line_style" class="form-select">
                    <option value="solid">Solid</option>
                    <option value="dashed">Dashed</option>
                    <option value="dotted">Dotted</option>
                </select>
            </div>

            <!-- Line Width -->
            <div class="col-md-6">
                <label for="line_width" class="form-label">Line Width:</label>
                <input type="number" class="form-control" name="line_width" value="3" min="1">
            </div>

            <!-- Switches -->
            <div class="col-md-6 form-check form-switch">
                <input class="form-check-input" type="checkbox" name="hide_box" id="hide_box" checked>
                <label class="form-check-label" for="hide_box">Hide Box</label>
            </div>

            <div class="col-md-6 form-check form-switch">
                <input class="form-check-input" type="checkbox" name="hide_grid" id="hide_grid">
                <label class="form-check-label" for="hide_grid">Hide Grid</label>
            </div>

            <div class="col-md-6 form-check form-switch">
                <input class="form-check-input" type="checkbox" name="hide_labels" id="hide_labels">
                <label class="form-check-label" for="hide_labels">Hide Labels</label>
            </div>

            <!-- Submit -->
            <div class="col-md-12 text-center">
                <button type="submit" class="btn btn-primary">Generate Graph</button>
            </div>
        </form>

        <br><br>

        {% if graph %}
        <div class="text-center">
            <h5>Download as SVG:</h5>
            <a href="/media/{{ svg_file_name }}" download="{{ svg_file_name }}">
                <button class="btn btn-secondary">Download SVG</button>
            </a>
            <br><br>
            <h5>Download as PDF:</h5>
            <a href="/media/{{ pdf_file_name }}" download="{{ pdf_file_name }}">
                <button class="btn btn-secondary">Download PDF</button>
            </a>
            <br>
            <h2>Generated Elevation Profile:</h2>
            <img src="data:image/png;base64,{{ graph }}" alt="Elevation Profile" style="max-width:75vw;">
        </div>
        {% endif %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const SPORT_SETTINGS = {
            "skitour": {
                "leicht": {line:"#064770", elements:"#064770", fill:"#d3edfc", y_min:800, y_max:2500},
                "mittel": {line:"#e63740", elements:"#064770", fill:"#d3edfc", y_min:800, y_max:2500},
                "schwer": {line:"#29211a", elements:"#064770", fill:"#d3edfc", y_min:800, y_max:2500}
            },
            "mtb": {
                "leicht": {line:"#2b7a0b", elements:"#2b7a0b", fill:"#d3fcd3", y_min:500, y_max:2000},
                "mittel": {line:"#1a4d00", elements:"#1a4d00", fill:"#d3fcd3", y_min:500, y_max:2000},
                "schwer": {line:"#0c2200", elements:"#0c2200", fill:"#d3fcd3", y_min:500, y_max:2000}
            },
            "laufen": {
                "leicht": {line:"#00c2c2", elements:"#00c2c2", fill:"#d3fcfc", y_min:500, y_max:2000},
                "mittel": {line:"#009999", elements:"#009999", fill:"#d3fcfc", y_min:500, y_max:2000},
                "schwer": {line:"#006666", elements:"#006666", fill:"#d3fcfc", y_min:500, y_max:2000}
            }
        };
        
        function updateColorsAndYAxis() {
            const sport = document.getElementById("sport").value;
            const difficulty = document.getElementById("difficulty").value;
            if(SPORT_SETTINGS[sport] && SPORT_SETTINGS[sport][difficulty]) {
                const settings = SPORT_SETTINGS[sport][difficulty];
                document.querySelector("input[name='line_color']").value = settings.line;
                document.querySelector("input[name='elements_color']").value = settings.elements;
                document.querySelector("input[name='fill_color']").value = settings.fill;
                document.querySelector("input[name='y_min']").value = settings.y_min;
                document.querySelector("input[name='y_max']").value = settings.y_max;
            }
        }
        
        document.getElementById("sport").addEventListener("change", updateColorsAndYAxis);
        document.getElementById("difficulty").addEventListener("change", updateColorsAndYAxis);
        </script>
